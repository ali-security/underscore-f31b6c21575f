name: Seal Build

on:
  workflow_dispatch: {}

jobs:
  pack:
    name: Build and pack npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build bundles
        run: npm run build

      - name: Match the publisher's npm version
        run: npm i -g npm@7.24.2

      - name: Pack tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: underscore-1.13.6.tgz
          if-no-files-found: error
